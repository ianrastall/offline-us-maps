[workspace]
members = ["crates/offline-maps-core", "crates/offline-maps-dev", "crates/offline-maps-ffi"]
resolver = "3"

[workspace.package]
version = "0.15.0"
license = "Unlicense"
edition = "2024"
rust-version = "1.99"
publish = false

# The C ABI contains panics with catch_unwind, which needs unwinding.
[profile.release]
panic = "unwind"
